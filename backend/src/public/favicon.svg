<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gradient for the main circle -->
    <radialGradient id="mainGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#26a9e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b75bb;stop-opacity:1" />
    </radialGradient>
    <!-- Gradient for the star -->
    <radialGradient id="starGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="16" cy="16" r="15" fill="url(#mainGradient)" stroke="#1a6ba8" stroke-width="0.5"/>
  
  <!-- Star shape in the center -->
  <g transform="translate(16, 16)">
    <path d="M0,-8 L2.5,-2.5 L8,-2.5 L3.5,1 L5,6.5 L0,3.5 L-5,6.5 L-3.5,1 L-8,-2.5 L-2.5,-2.5 Z" 
          fill="url(#starGradient)" 
          stroke="#ffffff" 
          stroke-width="0.3"/>
  </g>
  
  <!-- Subtle highlight -->
  <circle cx="12" cy="12" r="2" fill="#ffffff" opacity="0.3"/>
</svg>
